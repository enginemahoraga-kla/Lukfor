name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Type-checks the frontend and produces dist/ that Tauri embeds.
      - name: Build frontend
        run: npm run build

      - name: Check Rust
        working-directory: src-tauri
        run: cargo check --release

      # Only the environment-independent tests run here. The icon tests need a
      # real Start Menu and installed Store apps, so they are a local concern.
      # Quoted because a trailing "::" would otherwise be parsed as YAML mapping.
      - name: Test indexer
        working-directory: src-tauri
        run: "cargo test --release indexer::"
