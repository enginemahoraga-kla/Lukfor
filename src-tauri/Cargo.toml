[package]
name = "lukfor"
version = "0.1.0"
description = "Lukfor — Spotlight-style quick launcher for Windows"
edition = "2021"
license = "MIT"
readme = "../README.md"
repository = "https://github.com/enginemahoraga-kla/Lukfor"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
fuzzy-matcher = "0.3"
arboard = "3"
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
base64 = "0.22"
png = "0.17"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_Storage_FileSystem",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
